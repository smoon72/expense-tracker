<div class="card">

  <p-toolbar>
    <button pButton *ngFor="let item of items"
              severity="secondary"
              (click)="item.command && item.command({})">              
      <i [class]="item.icon">
      </i>
    </button>
  </p-toolbar>
  <p-table class="transaction-table" 
            [value]="transactions"
            stripedRows>
  <ng-template pTemplate="header">
    <tr>
      <th>Date</th>
      <th>Amount</th>
      <th>Category</th>
      <th>Description</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-transaction>
    <tr>
      <td>{{ transaction.date | date:'mediumDate'}}</td>
      <td>{{ transaction.amount }}</td>
      <td>{{ transaction.category }}</td>
      <td>{{ transaction.description }}</td>
    </tr>
  </ng-template>
</p-table>
</div>
